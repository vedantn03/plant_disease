name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: ruff check . --target-version py312

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pre-commit
      - run: pre-commit install-hooks
      - run: pre-commit run detect-private-key --all-files
      - run: pre-commit run detect-secrets --all-files

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and print environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip freeze
      - name: Install secret regression hook environment
        run: |
          python -m pip install pre-commit
          pre-commit install-hooks
      - name: Run Test Suite
        run: pytest tests/ -v -rs
      - name: Verify Knowledge Base Schema and YAML Parsing
        run: |
          python -c "import yaml; d = yaml.safe_load(open('kb/advisories.yaml', encoding='utf-8')); assert len(d['advisories']) == 38, 'Expected 38 classes'"
          python -c "import yaml; w = yaml.safe_load(open('kb/weather_rules.yaml', encoding='utf-8')); assert len(w['rules']) >= 6, 'Expected at least 6 weather rules'"
          python -c "import yaml; c = yaml.safe_load(open('kb/coverage.yaml', encoding='utf-8')); assert len(c['crops']) == 14, 'Expected 14 crops'"

  compose-core-config:
    runs-on: ubuntu-latest
    env:
      GRAFANA_ADMIN_USER: ci-user
      GRAFANA_ADMIN_PASSWORD: ci-placeholder-not-a-secret # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile core config --quiet

  compose-monitoring-config:
    runs-on: ubuntu-latest
    env:
      GRAFANA_ADMIN_USER: ci-user
      GRAFANA_ADMIN_PASSWORD: ci-placeholder-not-a-secret # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile core --profile monitoring config --quiet

  docker-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api -t plant-disease-api:ci .

  docker-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target ui -t plant-disease-ui:ci .

  tracked-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python scripts/check_tracked_files.py
