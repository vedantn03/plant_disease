# docker-compose.yml
# Plant Disease Pipeline — one-command stack
# Usage: docker compose up  (or: make up)
#
# Services:
#   api  — FastAPI + ResNet18 inference (port 8000)
#   ui   — Streamlit dashboard (port 8501)
#
# Notes:
#   - Dataset is NOT mounted; the API loads only models/best_model.pth and kb/
#   - models/ is read-only; logs/ is writable
#   - Both services restart unless explicitly stopped

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: plant_disease_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./kb:/app/kb:ro
      - ./logs:/app/logs
    environment:
      - DATA_ROOT=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    container_name: plant_disease_ui
    ports:
      - "8501:8501"
    volumes:
      - ./demo_samples:/app/demo_samples:ro
      - ./reports:/app/reports:ro
      - ./logs:/app/logs:ro
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
