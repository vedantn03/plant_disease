# Promotion-gate thresholds. ALL four criteria are PROVISIONAL until seed-variance
# margins are approved. scripts/promote.py defaults to --dry-run and refuses to
# move @champion while any criterion has provisional: true.
#
# Derivation notes cite measured artifacts, not invented product claims.
# Relative rules use the current champion's VAL baseline; the first registered
# model is bootstrapped from its own VAL numbers (see src/gates.py).

schema_version: 1

champion_reference:
  checkpoint: models/best_model.pth
  mlflow_run_id: fb731412d82544e0abc231b8d7c62f95
  split: val
  note: >
    Do not overwrite models/best_model.pth. Candidate weights go to
    models/candidates/<run_id>.pth. Serving still loads the local checkpoint
    until Task T9.

criteria:
  macro_f1:
    provisional: true
    metric: within_crop_macro_f1
    rule: candidate_val_within_crop_macro_f1 >= champion_val_within_crop_macro_f1 - margin
    margin: 0.005
    derivation: >
      Baseline is the measured champion VAL within-crop macro-F1 of 0.9908.
      The margin remains provisional until seed variance is measured. The first
      model compares against itself.

  min_recall:
    provisional: true
    rule: min_over_classes(val_recall) >= floor, subject to tiny-class rule
    floor: 0.85
    tiny_class_rule: pending_approval
    tiny_class_n_example: 23
    derivation: >
      Floor 0.85 copied from docs/MANUAL_STEPS.md Task T7. A class with
      n_val=23 moves 1/n ≈ 0.0435 recall per extra error. Proposed alternatives
      (not applied until approved):
      (a) Wilson lower bound of recall vs floor; (b) skip classes with
      n_val < n_min. See reports/tiny_class_recall_analysis.json after
      scripts/compute_val_diagnostics.py.

  bg_drop:
    provisional: true
    rule: candidate_val_bg_drop <= champion_val_bg_drop + margin
    margin: 0.02
    absolute_informational_max: 0.08
    derivation: >
      The old <=0.08 ceiling had no VAL basis: 0.0663 was a TEST value.
      The measured champion VAL black-fill drop is 0.1843. Use a relative
      margin under the agreed three-fill protocol; the absolute value is
      informational only. The drop mixes background reliance with masking artifacts.

  ece:
    provisional: true
    rule: val_ece_15bin <= max_ece
    max_ece: 0.05
    n_bins: 15
    temperature_scaling: not_applied_at_serving
    derivation: >
      Ceiling 0.05 remains provisional. The measured unscaled (T=1) VAL ECE
      is 0.00110. Bootstrap percentile CIs for ECE
      are known to be upward-biased; the point estimate can fall outside
      its own bootstrap CI (see docs/DECISIONS.md).
