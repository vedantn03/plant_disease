schema_version: 2
split: VAL
selection_source: VAL only; TEST is reporting only
criteria:
  within_crop_macro_f1:
    provisional: true
    metric: within_crop_macro_f1
    rule: candidate >= champion - margin
    margin: 0.005
    observed_seed_spread: 0.0021240000000000148
    observed_seed_spread_source: reports/seed_variance.json#/metrics/within_crop_macro_f1/range
    rationale: User-selected relative non-inferiority margin on VAL within-crop macro-F1.
  minimum_class_recall:
    provisional: true
    metric: per_class_recall
    rule: all class recall scores >= floor; Wilson lower bound applies when VAL support
      < support_cutoff
    floor: 0.85
    support_cutoff: 30
    wilson_confidence_level: 0.95
    wilson_z: 1.96
    observed_seed_spread: 0.02597399999999994
    observed_seed_spread_source: reports/seed_variance.json#/metrics/min_recall/range
    rationale: User-selected floor; use a Wilson lower bound for classes with small
      VAL support.
  bg_drop_per_image_mean:
    provisional: true
    metric: bg_drop_per_image_mean
    fill: per_image_mean
    rule: candidate <= champion + margin
    margin: 0.03
    informational_fills:
    - black
    - mid_grey
    observed_seed_spread: 0.0407
    observed_seed_spread_source: reports/seed_variance.json#/metrics/bg_drop_per_image_mean/range
    rationale: Gate only on per-image-mean fill; black and mid-grey fill results remain
      informational.
  ece:
    provisional: true
    metric: ece
    rule: candidate <= maximum
    maximum: 0.01
    observed_seed_spread: 0.000495
    observed_seed_spread_source: reports/seed_variance.json#/metrics/ece/range
    rationale: User-selected maximum for unscaled VAL ECE.
