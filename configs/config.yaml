# ============================================================
# Plant Disease Pipeline – Central Configuration
# ============================================================
# All paths are relative to the project root (plant_disease/).
# DATA_ROOT env-var overrides data.root.

project:
  name: plant-disease-pipeline
  version: "0.1.0"

seed: 42

data:
  root: ""          # overridden by DATA_ROOT env-var at runtime
  image_size: 224   # resize to this before model input
  # Subsample cap per class for fast training runs.
  # Set to null for full-data training on all 38,002 images.
  subsample_per_class: null

split:
  train: 0.70
  val: 0.15
  test: 0.15
  manifest_dir: "data/splits"

model:
  arch: "resnet18"
  pretrained: true
  num_classes: 38
  # Imbalance strategy: "weighted_loss" | "weighted_sampler"
  imbalance_strategy: "weighted_loss"

training:
  epochs: 8
  batch_size: 64        # batch 64 on RTX 3050 6GB with AMP
  lr: 0.001
  weight_decay: 0.0001
  amp: true             # automatic mixed precision
  num_workers: 0

augmentation:
  hflip_prob: 0.5
  vflip_prob: 0.0
  rotation_degrees: 15
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "plant-disease-baseline"
  registered_model_name: "PlantDiseaseClassifier"
  champion_alias: "champion"

serving:
  # "local" preserves the current champion-file behavior. "registry" resolves
  # the configured MLflow @champion alias without overwriting local weights.
  model_source: "local"
  registry_strict: false
  # Confidence below this → status="uncertain"
  confidence_threshold: 0.50
  max_upload_bytes: 10485760   # 10 MB
  top_k: 5
  port: 8000
  log_file: "logs/requests.jsonl"

background_check:
  bg_check_enabled: true
  abstain_on_bg_inconsistent: false
  min_mask_area_fraction: 0.05  # Provisional guard; pending review
  max_mask_area_fraction: 0.95  # Provisional guard; pending review
  val_sample_size: 100
  rates_report_path: "reports/bg_check_rates.json"
  field_probe_dir: "data/field_probe"
  field_probe_report_path: "reports/field_probe.json"
  request_timeout_seconds: 30

drift:
  blur_sigma: 3.0          # Gaussian blur sigma for drift simulation
  brightness_factor: 0.6   # multiply pixel values by this
  ks_alpha: 0.05           # Existing KS significance level; remains provisional
  baseline_sample_size: 500
  psi_bins: 10
  psi_epsilon: 0.000001
  baseline_path: "reports/baseline_features.json"
  request_log_path: "logs/requests.jsonl"
  latest_report_path: "reports/drift_latest.json"
  window_size: 200
  minimum_sample_count: 30
  poll_interval_seconds: 15
  exporter_port: 9101
  psi_threshold: 0.2       # Conventional PSI proposal; pending user approval
  drift_rule: "psi_and_ks"
  thresholds_provisional: true
  alert_for: "1m"

evaluation:
  # Macro-F1 drop allowed for promotion gate (make retrain)
  promotion_margin: 0.03
  # Authoritative (still PROVISIONAL) 4-criterion floors live here:
  gate_thresholds_path: configs/gates/gate_thresholds.yaml
