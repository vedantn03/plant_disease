    label_caveat: Bactericide protectant; strictly observe low rate to prevent phytotoxic
      leaf chlorosis and shot-holing.
    source_id: psu_peach
  - active_ingredient: Oxytetracycline (Mycoshield) (FRAC 41 Bactericide)
