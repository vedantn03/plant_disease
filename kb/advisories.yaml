- crop: corn_(maize)
  condition: cercospora_leaf_spot gray_leaf_spot
  pathogen_type: fungal
  recommendation_text: Gray leaf spot causes rectangular necrotic lesions strictly
    bounded by leaf veins. Inoculum overwinters in corn residue; no-till continuous
    corn is at highest risk. Deploy resistant hybrids and rotate crops. Fungicide
    application between VT (tasseling) and R2 (blister) is recommended when weather
    is warm and humid.
  caution_text: Avoid late-season fungicide applications after R3 (milk stage) as
    economic yield response declines sharply.
  source_name: 'Purdue Extension - Diseases of Corn: Gray Leaf Spot'
  source_url: https://www.extension.purdue.edu/extmedia/BP/BP-56-W.pdf
