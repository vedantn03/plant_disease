- crop: tomato
  condition: septoria_leaf_spot
  pathogen_type: fungal
  recommendation_text: Septoria leaf spot produces numerous small, circular spots
    (1-3mm) with gray centers, dark brown borders, and tiny black speck pycnidia within
    the center. It progresses rapidly from lower to upper leaves. Rotate crops away
    from solanaceous plants, mulch around base to prevent soil splash, and apply foliar
    fungicides.
  caution_text: Severe defoliation exposes tomato fruit to sunscald. Start treatments
    at the first sign of lower lesions.
  source_name: 'Purdue University Extension: Septoria Leaf Spot of Tomato'
  source_url: https://www.extension.purdue.edu/extmedia/BP/BP-22-W.pdf
  last_verified: '2026-10-28'
  status: VERIFIED
  region: US (Purdue / Cornell) & India (ICAR-IIHR)
  recommendation_scope: both
  cultural_controls:
  - practice: Mulch beds with plastic or straw to prevent rain-splash of fungal spores
      from soil onto leaves.
    source_id: purdue_septoria
  - practice: 2 to 3-year crop rotation with non-solanaceous hosts; remove infected
      crop residue.
    source_id: purdue_septoria
  chemical_options:
  - active_ingredient: Chlorothalonil 75% WP (FRAC M05)
    rate_text: 2.0 g per liter of water on 7-10 day intervals
    label_caveat: Multi-site contact protectant; apply before rainy periods.
    source_id: purdue_septoria
  - active_ingredient: Copper Hydroxide (FRAC M01) + Mancozeb (FRAC M03) tank mix
    rate_text: 2.0 g + 2.0 g per liter of water
    label_caveat: Provides dual protection against Septoria leaf spot and bacterial
      spot simultaneously.
    source_id: purdue_septoria
  - active_ingredient: Azoxystrobin 23% SC (FRAC 11)
    rate_text: 1.0 ml per liter of water
    label_caveat: Systemic strobilurin; alternate with multisite protectants to manage
      resistance.
    source_id: purdue_septoria
  sources: []
  region_caveat: 'Source region: US (Purdue / Cornell) & India (ICAR-IIHR); verify
    local regulatory registrations, label rates, and pre-harvest intervals (PHI) before
    use.'
- crop: tomato
  condition: spider_mites two-spotted_spider_mite
  pathogen_type: pest
  recommendation_text: 'Two-spotted spider mites are arachnid arthropods that pierce
    leaf cells, causing fine yellow stippling and webbing on the underside. Hot, dry,
    and dusty conditions accelerate population explosions. NEGATIVE ASSERTION: DO
    NOT SPRAY BROAD-SPECTRUM FUNGICIDES OR PYRETHROIDS, which eradicate predatory
    mites and trigger secondary outbreaks. Use selective miticides, insecticidal soaps,
    or predatory mites (Phytoseiulus persimilis).'
  caution_text: 'NEGATIVE ASSERTION: Fungicides must NEVER be used for spider mites.
    Use targeted acaricides/miticides.'
  source_name: 'UC IPM Pest Management Guidelines: Tomato Spider Mites'
  source_url: https://ipm.ucanr.edu/PMG/r783400111.html
  last_verified: '2026-10-28'
  status: VERIFIED
  region: Global (UC IPM / UF/IFAS / TNAU)
  recommendation_scope: both
  cultural_controls:
  - practice: Overhead misting or water washing of lower leaf surfaces to knock down
      mite colonies and raise humidity.
    source_id: uc_mite
  - practice: Control weeds (nightshade, pigweed) around field borders that serve
      as alternate hosts.
    source_id: uc_mite
  - practice: Release predatory mites (Phytoseiulus persimilis or Neoseiulus californicus)
      in greenhouse crops.
    source_id: uc_mite
  chemical_options:
  - active_ingredient: Spiromesifen 22.9% SC (Oberon - IRAC 23 Miticide)
    rate_text: 1.0 ml per liter of water thoroughly targeting lower leaf lamina
    label_caveat: Lipid synthesis inhibitor acaricide; highly selective for mites
      and whiteflies, preserving beneficials.
    source_id: uc_mite
  - active_ingredient: Abamectin 1.9% EC (IRAC 6 Miticide)
    rate_text: 0.5 ml per liter of water as per registered vegetable label
    label_caveat: Translaminar avermectin; penetrates leaf cuticle to kill feeding
      mites on underside.
    source_id: uc_mite
  - active_ingredient: Potassium Salts of Fatty Acids (Insecticidal Soap / Neem Oil
      1% EC)
    rate_text: 5.0 ml per liter of water as contact organic knockdown
    label_caveat: Contact miticide; requires direct droplet impact on mites to dissolve
      protective cuticle.
    source_id: uc_mite
  sources: []
  region_caveat: 'Source region: Global (UC IPM / UF/IFAS / TNAU); verify local regulatory
    registrations, label rates, and pre-harvest intervals (PHI) before use.'
- crop: tomato
  condition: target_spot
  pathogen_type: fungal
  recommendation_text: Tomato target spot causes pinpoint brown spots on leaves that
    enlarge into target-like lesions with concentric rings and yellow halos. It attacks
    both foliage and fruit under warm, humid conditions. Avoid overhead irrigation,
    stake plants to promote air circulation, and apply preventative fungicides.
  caution_text: Target spot can be confused with early blight; target spot lesions
    are smaller and more numerous.
  source_name: 'University of Florida IFAS Extension: Target Spot of Tomato'
  source_url: https://edis.ifas.ufl.edu/publication/PP316
  last_verified: '2026-10-28'
  status: VERIFIED
  region: US (UF/IFAS) & India (ICAR-IIHR)
  recommendation_scope: both
  cultural_controls:
  - practice: Stake and tie vines to keep foliage off the ground and facilitate fast
      canopy drying.
    source_id: uf_target
  - practice: Sanitize stakes and destroy infected residue at end of cropping cycle.
    source_id: uf_target
  chemical_options:
  - active_ingredient: Chlorothalonil 75% WP (FRAC M05) or Mancozeb 75% WP (FRAC M03)
    rate_text: 2.0 - 2.5 g per liter of water preventatively
    label_caveat: Broad-spectrum contact protectant with multisite mode of action.
    source_id: uf_target
  - active_ingredient: Boscalid + Pyraclostrobin (FRAC 7 + 11)
    rate_text: Apply as per registered tomato label under high target spot pressure
    label_caveat: Dual-action translaminar fungicide providing strong protective and
      curative suppression.
    source_id: uf_target
  sources: []
  region_caveat: 'Source region: US (UF/IFAS) & India (ICAR-IIHR); verify local regulatory
    registrations, label rates, and pre-harvest intervals (PHI) before use.'
- crop: tomato
  condition: tomato_yellow_leaf_curl_virus
  pathogen_type: viral
  recommendation_text: 'Tomato Yellow Leaf Curl Virus (TYLCV) is a begomovirus transmitted
    exclusively by the whitefly Bemisia tabaci. Infected plants show severe upward
    leaf cupping, marginal chlorosis, stunted bushy growth, and flower abortion. NEGATIVE
    ASSERTION: FUNGICIDES DO NOT CURE VIRUSES. Manage by using TYLCV-resistant hybrids,
    insect-proof netting, reflective mulches, and whitefly vector suppression.'
  caution_text: 'NEGATIVE ASSERTION: Fungicides must NEVER be sprayed for TYLCV. Control
    focuses on insect vector management.'
  source_name: 'UC IPM Pest Management Guidelines: Tomato Yellow Leaf Curl'
  source_url: https://ipm.ucanr.edu/PMG/r783101611.html
  last_verified: '2026-10-28'
  status: VERIFIED
  region: Global (UC IPM / UF/IFAS / ICAR-IIHR / TNAU)
  recommendation_scope: both
  cultural_controls:
  - practice: Plant certified TYLCV-resistant tomato hybrids (e.g. Tyking, Sebring,
      Kashi Vishesh).
    source_id: uc_tylcv
  - practice: Use UV-reflective silver plastic mulch to deter incoming whiteflies
      from landing on young seedlings.
    source_id: uc_tylcv
  - practice: Install 50-mesh insect netting on greenhouse vents and nurseries to
      physically exclude whiteflies.
    source_id: uc_tylcv
  chemical_options:
  - active_ingredient: Spirotetramat 15.3% OD (Movento - IRAC 23 Insecticide)
    rate_text: 1.0 ml per liter of water targeting whitefly nymphs and adults
    label_caveat: Systemic two-way insecticide for whitefly vector control. Does not
      cure existing viral symptoms.
    source_id: uc_tylcv
  - active_ingredient: Thiamethoxam 25% WG (IRAC 4A Neonicotinoid)
    rate_text: 0.3 - 0.5 g per liter of water as drench or foliar spray at transplanting
    label_caveat: Systemic seedling protection against whitefly feeding during vulnerable
      early vegetative phase.
    source_id: uc_tylcv
  sources: []
  region_caveat: 'Source region: Global (UC IPM / UF/IFAS / ICAR-IIHR / TNAU); verify
    local regulatory registrations, label rates, and pre-harvest intervals (PHI) before
    use.'
- crop: tomato
  condition: tomato_mosaic_virus
  pathogen_type: viral
  recommendation_text: 'Tomato Mosaic Virus (ToMV) is a tobamovirus causing alternating
    light and dark green mosaic mottle, leaf blistering, and ''shoestring'' distortion.
    It is extremely stable and transmitted mechanically via workers'' hands, pruning
    shears, contaminated seed, and tobacco smoke. NEGATIVE ASSERTION: FUNGICIDES DO
    NOT CURE VIRUSES. Sanitize hands with milk or trisodium phosphate (TSP), use resistant
    cultivars (Tm-22 gene), and discard infected plants.'
  caution_text: 'NEGATIVE ASSERTION: Fungicides must NEVER be sprayed for ToMV. The
    virus spreads mechanically.'
  source_name: 'Cornell CALS Vegetable MD Online: Tomato Mosaic Virus'
  source_url: https://vegetablemdonline.ppath.cornell.edu/factsheets/Virus_Tomato.htm
  last_verified: '2026-10-28'
  status: VERIFIED
  region: Global (Cornell / UC IPM / TNAU)
  recommendation_scope: both
  cultural_controls:
  - practice: Select certified ToMV-resistant cultivars with the Tm-2 or Tm-2^2 resistance
      gene.
    source_id: cornell_tomv
  - practice: Wash hands and tools in skim milk (20%) or trisodium phosphate (TSP)
      to denature virus particles during pruning.
    source_id: cornell_tomv
  - practice: Strictly prohibit smoking or handling tobacco products prior to handling
      tomato transplants.
    source_id: cornell_tomv
  chemical_options:
  - active_ingredient: Trisodium Phosphate (TSP) 10% solution (Tool & Hand Disinfectant)
    rate_text: 100 g per liter of water used as disinfectant dip for shears and knives
      between plants
    label_caveat: SANITIZING AGENT, not a plant spray. Denatures viral protein coats
      to prevent mechanical transmission.
    source_id: cornell_tomv
  sources: []
  region_caveat: 'Source region: Global (Cornell / UC IPM / TNAU); verify local regulatory
    registrations, label rates, and pre-harvest intervals (PHI) before use.'
