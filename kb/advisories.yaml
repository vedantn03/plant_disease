- crop: corn_(maize)
  condition: common_rust_
  pathogen_type: fungal
  recommendation_text: 'Common rust (Puccinia sorghi) is primarily managed by planting
    resistant corn hybrids. In seed corn production or susceptible sweet corn, foliar
    fungicides may be beneficial if rust pustules appear on upper leaves prior to
    tasseling and environmental conditions favor continuous disease development. Triazole
    and strobilurin fungicide classes are listed as management options in extension
    guides.

    '
  caution_text: 'Fungicide treatment in commercial field corn is rarely cost-effective
    unless disease pressure is extreme and occurs prior to silking. Specific rates
    and pre-harvest intervals must be consulted on the registered label.

    '
  weather_rule:
    humidity_min: 85
    temp_min: 16
    temp_max: 25
    note: 'Moderate temperatures (16-25°C) and high relative humidity (>= 85%) favor
      Puccinia sorghi urediniospore germination and secondary spread. (Source: Purdue
      Extension, https://www.extension.purdue.edu/extmedia/BP/BP-82-W.pdf)

      '
    source: Purdue Extension
  source_name: Purdue University Cooperative Extension
  source_url: https://www.extension.purdue.edu/extmedia/BP/BP-82-W.pdf
  last_verified: '2026-10-14'
  status: VERIFIED
  region: US (Purdue Extension) & India (ICAR-IIMR)
  recommendation_scope: both
  cultural_controls:
  - practice: Plant certified resistant or tolerant corn hybrids with major gene or
      adult-plant resistance.
    source_id: primary_source
  - practice: Early planting to escape peak late-season airborne urediniospore showers.
    source_id: primary_source
  chemical_options:
  - active_ingredient: Azoxystrobin (FRAC 11) + Difenoconazole (FRAC 3)
    rate_text: Apply if rust pustules appear on upper canopy leaves prior to tasseling.
    label_caveat: Broad-spectrum dual-action fungicide; follow label guidelines for
      sweet vs field corn.
    source_id: primary_source
  sources:
