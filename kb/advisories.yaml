- crop: peach
  condition: bacterial_spot
  pathogen_type: bacterial
  recommendation_text: Peach bacterial spot causes shot-hole leaf perforation, defoliation,
    and cracked fruit lesions. Favored by frequent rains and blowing sand/wind abrasion.
    Select resistant cultivars. Fixed copper sprays applied at low rates or oxytetracycline
    bactericide are utilized during active growth.
  caution_text: Peach leaves are extremely sensitive to copper phytotoxicity. Never
    apply high rates after bloom.
