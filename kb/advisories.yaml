    publisher: Purdue University Cooperative Extension
    url: https://www.extension.purdue.edu/extmedia/BP/BP-82-W.pdf
    access_date: '2026-10-14'
- crop: corn_(maize)
  condition: northern_leaf_blight
  pathogen_type: fungal
  recommendation_text: Northern corn leaf blight causes large, cigar-shaped grayish-green
    to tan lesions (1-6 inches long). Use resistant hybrids with Ht genes, practice
    minimum 1-year crop rotation, and deep-till infected corn debris. Foliar fungicides
    are justified in seed corn or susceptible sweet corn if lesions appear before
    silking.
  caution_text: Economic thresholds rarely justify spraying commercial field corn
    unless upper leaves show lesions before VT stage.
  source_name: Purdue University Extension - Northern Corn Leaf Blight
  source_url: https://extension.entm.purdue.edu/fieldcropsipm/diseases/northern-corn-leaf-blight.php
