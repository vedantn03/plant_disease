- crop: grape
  condition: black_rot
  pathogen_type: fungal
  recommendation_text: 'Grape black rot (Guignardia bidwellii) is managed through
    vineyard sanitation and fungicide applications during early shoot growth through
    fruit set. Destroy or remove overwintered mummified berries from the canopy and
    vineyard floor during dormant pruning. Protectant fungicides (e.g. mancozeb) applied
    from pre-bloom through early berry development prevent cluster infection.

    '
  caution_text: 'Berries become immune to black rot infection approximately 4-5 weeks
    after bloom. Post-bloom spray timing is critical. Specific dosages and spray intervals
    must follow label instructions; resistance management requires alternating FRAC
    codes.

    '
  weather_rule:
    humidity_min: 85
    temp_min: 21
    temp_max: 28
    note: 'Warm temperatures (21-28°C) combined with prolonged leaf wetness (6-8 hours)
      trigger rapid black rot ascospore and conidia infection cycles. (Source: Ohio
      State University Extension, https://ohioline.osu.edu/factsheet/plpath-fru-24)

      '
    source: OSU Extension
  source_name: Ohio State University Extension FactSheet
  source_url: https://ohioline.osu.edu/factsheet/plpath-fru-24
  last_verified: '2026-10-14'
  status: VERIFIED
  region: US (OSU Extension) & India (ICAR-NRCG Pune)
  recommendation_scope: both
  cultural_controls:
  - practice: Remove and destroy all overwintered mummified berries from vine trellises
      and ground during winter pruning.
    source_id: primary_source
  - practice: Canopy shoot positioning and summer leaf pulling around fruit clusters
      to speed up dew drying.
    source_id: primary_source
  chemical_options:
  - active_ingredient: Mancozeb 75% WP (FRAC M03)
    rate_text: Apply from pre-bloom (1-3 inch shoot growth) through early berry development.
    label_caveat: Protectant fungicide; observe strict 66-day pre-harvest interval
      on grapes.
    source_id: primary_source
  - active_ingredient: Tebuconazole 25.9% EC (FRAC 3)
    rate_text: Apply as per label recommendation during post-infection risk window.
    label_caveat: Systemic fungicide; rotate FRAC groups to prevent resistance.
    source_id: primary_source
  sources:
  - id: primary_source
    publisher: Ohio State University Extension FactSheet
    url: https://ohioline.osu.edu/factsheet/plpath-fru-24
    access_date: '2026-10-14'
- crop: grape
  condition: esca_(black_measles)
  pathogen_type: fungal
  recommendation_text: Grape Esca is a vascular trunk disease complex (Phaeomoniella
    chlamydospora, Phaeoacremonium minimum, and basidiomycetes). Leaves exhibit interveinal
    'tiger-stripe' necrosis and berries show speckled measles. No curative foliar
    fungicide exists. Protect pruning wounds immediately after cutting and rogue severely
    infected dying cordons.
  caution_text: Foliar fungicide sprays DO NOT cure Esca. The pathogen resides internally
    within woody trunk tissue.
  source_name: 'UC IPM Pest Management Guidelines: Grape Esca'
  source_url: https://ipm.ucanr.edu/PMG/r302100511.html
  last_verified: '2026-10-28'
  status: VERIFIED
  region: US (UC IPM) & India (ICAR-NRCG Pune)
  recommendation_scope: both
  cultural_controls:
  - practice: Delay pruning until late winter when wound healing is rapid and spore
      discharge is lower.
    source_id: uc_esca
  - practice: Apply wound protectants (paste with tebuconazole, thiophanate-methyl,
      or Trichoderma) within 24 hours of pruning.
    source_id: uc_esca
  - practice: Retrain a new healthy sucker to replace cankered cordons; excise diseased
      wood 10cm below symptom.
    source_id: uc_esca
  chemical_options:
  - active_ingredient: Tebuconazole 25.9% EC or Thiophanate-methyl (Wound Sealant)
    rate_text: Apply directly as paint/paste onto fresh pruning cuts (>2cm diameter)
    label_caveat: Pruning wound protectant only; foliar spray is ineffective against
      trunk vascular disease.
    source_id: uc_esca
  - active_ingredient: Trichoderma atroviride / T. asperellum (Biological Wound Protectant)
    rate_text: Spray or paint onto pruning wounds as per manufacturer instructions
    label_caveat: Beneficial bio-control agent that colonizes fresh cuts, preventing
      wood-canker fungi penetration.
    source_id: uc_esca
