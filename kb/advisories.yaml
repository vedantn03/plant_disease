- crop: grape
  condition: leaf_blight_(isariopsis_leaf_spot)
  pathogen_type: fungal
  recommendation_text: Isariopsis leaf spot produces irregular, angular brown spots
    on leaves with velvety olivaceous fungal growth on the underside. High humidity
    and post-monsoon conditions favor spread. Prune congested shoots, remove infected
    fallen leaves, and apply copper or DMI fungicides.
  caution_text: Observe strict Pre-Harvest Intervals (PHI) on table and wine grapes.
