- crop: apple
  condition: apple_scab
  pathogen_type: fungal
  recommendation_text: 'Apple scab (Venturia inaequalis) is managed by applying protectant
    fungicides starting at green tip through primary ascospore discharge. Captan and
    mancozeb are standard protectant options cited in university guides; systemic
    fungicides are reserved for post-infection reach-back within recommended label
    hours. In autumn, flail-mow or shred fallen leaves to accelerate decomposition
    and reduce overwintering pseudothecia inoculum.

    '
  caution_text: 'Venturia inaequalis populations have documented resistance to strobilurin
    (FRAC 11) and DMI (FRAC 3) fungicides. Rotate chemical groups according to regional
    FRAC recommendations. Product application rates must be taken from the manufacturer
    label.

    '
  weather_rule:
    humidity_min: 80
    temp_min: 16
    temp_max: 24
    note: 'Prolonged leaf wetness (6-9 hours) at moderate temperatures (16-24°C) satisfies
      Mills infection criteria for primary apple scab penetration. (Source: Cornell
      CALS Tree Fruit Pathology, https://blogs.cornell.edu/plantpathhvl/apple-diseases/apple-scab/)

      '
    source: Cornell CALS
  source_name: Cornell CALS Tree Fruit Pathology
  source_url: https://blogs.cornell.edu/plantpathhvl/apple-diseases/apple-scab/
  last_verified: '2026-10-14'
  status: VERIFIED
  region: US (Cornell CALS) & India (SKUAST / ICAR-CITH)
  recommendation_scope: both
  cultural_controls:
  - practice: Rake and flail-mow or shred fallen apple leaves in autumn to accelerate
      decomposition and reduce ascospore inoculum.
    source_id: primary_source
  - practice: Prune canopy branches annually to improve sunlight penetration and air
      movement, reducing wetting periods.
    source_id: primary_source
  chemical_options:
  - active_ingredient: Captan 50% WP or Mancozeb 75% WP (FRAC M04 / M03)
    rate_text: Apply protectant sprays starting at green-tip according to regional
      spray advisory schedules.
    label_caveat: Protectant contact fungicide with multisite mode of action; apply
      prior to rain events.
    source_id: primary_source
  - active_ingredient: Difenoconazole 25% EC (FRAC 3)
    rate_text: Apply at label-specified rates with 72-96 hour post-infection reach-back
      window.
    label_caveat: Systemic DMI fungicide; rotate chemistry to prevent resistance development.
    source_id: primary_source
  sources:
  - id: primary_source
    publisher: Cornell CALS Tree Fruit Pathology
    url: https://blogs.cornell.edu/plantpathhvl/apple-diseases/apple-scab/
    access_date: '2026-10-14'
- crop: apple
  condition: black_rot
  pathogen_type: fungal
  recommendation_text: Apple black rot (Botryosphaeria obtusa) causes 'frog-eye' foliar
    lesions and fruit rot. Primary management requires pruning dead wood, mummified
    apples, and fire-blight cankers which serve as fungal reservoirs. Apply protectant
    fungicides from silver tip through post-bloom petal fall.
  caution_text: Chemical sprays alone fail if dead wood reservoirs remain in the orchard
    canopy.
  source_name: Cornell CALS Tree Fruit Pathology Guidelines
  source_url: https://blogs.cornell.edu/plantpathhvl/apple-diseases/black-rot/
  last_verified: '2026-10-28'
  status: VERIFIED
  region: US (Cornell Tree Fruit) & India (SKUAST / ICAR-CITH)
  recommendation_scope: both
  cultural_controls:
  - practice: Prune out dead wood, cankered twigs, and remove mummified fruit during
      winter dormant season.
    source_id: cornell_apple
  - practice: Flail-mow or rake dropped leaves and prunings to reduce overwintering
      pycnidia.
    source_id: cornell_apple
  chemical_options:
  - active_ingredient: Captan 50% WP or Mancozeb 75% WP (FRAC M04 / M03)
    rate_text: 2.0 - 2.5 g per liter of water at pink bud through petal fall
    label_caveat: Broad-spectrum contact protectant; apply before wetting infection
      events.
    source_id: cornell_apple
  - active_ingredient: Thiophanate-methyl (FRAC 1) + Captan tank mix
    rate_text: Apply at registered label rate during early cover sprays
    label_caveat: Systemic benzimidazole for rot suppression; must be tank-mixed with
      protectant to manage resistance.
    source_id: cornell_apple
  sources: []
  region_caveat: 'Source region: US (Cornell Tree Fruit) & India (SKUAST / ICAR-CITH);
    verify local regulatory registrations, label rates, and pre-harvest intervals
    (PHI) before use.'
- crop: apple
  condition: cedar_apple_rust
  pathogen_type: fungal
  recommendation_text: Cedar-apple rust requires alternate juniper/red cedar hosts
    to complete its life cycle. Foliar symptoms appear as vivid yellow-orange spots
    with pycnia. Eradicate nearby eastern red cedar trees where feasible, or apply
    DMI triazole fungicides during tight cluster to petal fall.
  caution_text: Protectant fungicides like Captan alone have poor efficacy against
    rust; use DMI or strobilurins.
  source_name: Penn State Extension Tree Fruit Disease Guide
  source_url: https://extension.psu.edu/cedar-apple-rust
  last_verified: '2026-10-28'
  status: VERIFIED
  region: US (Penn State / Purdue Extension)
  recommendation_scope: both
  cultural_controls:
  - practice: Remove red cedar trees or galls within 1-2 miles of commercial orchard
      boundary where practical.
    source_id: psu_rust
  - practice: Plant rust-resistant apple cultivars (e.g. Liberty, Freedom, Enterprise).
    source_id: psu_rust
  chemical_options:
  - active_ingredient: Myclobutanil (FRAC 3) or Difenoconazole 25% EC (FRAC 3)
    rate_text: 0.5 - 1.0 ml per liter of water as per registered label
    label_caveat: Highly effective systemic triazole; apply from pink through petal
      fall.
    source_id: psu_rust
  - active_ingredient: Mancozeb 75% WP (FRAC M03)
    rate_text: 2.0 - 2.5 g per liter of water
    label_caveat: Apply as protective barrier on emerging foliage. Observe 77-day
      PHI.
    source_id: psu_rust
  sources: []
  region_caveat: 'Source region: US (Penn State / Purdue Extension); verify local
    regulatory registrations, label rates, and pre-harvest intervals (PHI) before
    use.'
- crop: cherry_(including_sour)
  condition: powdery_mildew
  pathogen_type: fungal
  recommendation_text: Cherry powdery mildew forms white powdery patches on young
    expanding leaves and fruit stems. Maintain an open canopy to maximize sunlight
    penetration. Begin fungicide applications at shuck fall when young fruit is most
    vulnerable.
  caution_text: Do not apply sulfur at temperatures above 30°C to avoid severe foliar
    phytotoxicity.
  source_name: Washington State University Extension Tree Fruit Guidelines
  source_url: https://treefruit.wsu.edu/crop-protection/opm/cherry-powdery-mildew/
  last_verified: '2026-10-28'
  status: VERIFIED
  region: US (WSU / OSU Extension) & India (SKUAST)
  recommendation_scope: both
  cultural_controls:
  - practice: Prune interior shoots to open the tree canopy to sunlight and rapid
      air drying.
    source_id: wsu_cherry
  - practice: Avoid excessive nitrogen fertilization which stimulates succulent susceptible
      foliage.
    source_id: wsu_cherry
  chemical_options:
