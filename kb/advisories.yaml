- crop: orange
  condition: haunglongbing_(citrus_greening)
  pathogen_type: bacterial
  recommendation_text: Citrus Greening (HLB) is caused by the unculturable phloem
    bacterium Candidatus Liberibacter asiaticus, vectored by the Asian Citrus Psyllid
    (Diaphorina citri). Foliar symptoms show asymmetrical blotchy mottle crossing
    leaf veins. NO FUNGICIDE OR CHEMICAL CURES THE BACTERIA. Management requires aggressive
    psyllid vector suppression, certified nursery stock, and rogueing infected trees.
  caution_text: 'NEGATIVE ASSERTION: Fungicides must NEVER be sprayed for HLB. They
    have zero bactericidal efficacy.'
  source_name: University of Florida IFAS Citrus Extension Guide
  source_url: https://crec.ifas.ufl.edu/research/citrus-production/disease-management/huanglongbing/
  last_verified: '2026-10-28'
  status: VERIFIED
  region: Global (UF/IFAS / USDA-ARS / ICAR-CCRI)
  recommendation_scope: both
  cultural_controls:
  - practice: Scout for and rogue (physically remove and destroy) confirmed HLB-positive
      trees to protect adjacent orchard.
    source_id: uf_hlb
  - practice: Plant only certified disease-free grafted trees propagated in insect-proof
      screenhouses.
    source_id: uf_hlb
  chemical_options:
  - active_ingredient: Imidacloprid 17.8% SL or Thiamethoxam (FRAC 4A Insecticide
      - Vector Control)
    rate_text: 0.3 - 0.5 ml per liter of water applied during new vegetative flush
      to control psyllid vector
    label_caveat: INSECTICIDE for psyllid vector suppression; does not cure infected
      tree tissue. Comply with pollinator protections.
    source_id: uf_hlb
  - active_ingredient: Horticultural Mineral Spray Oil (2% v/v)
    rate_text: 20 ml per liter of water as seasonal flush spray
    label_caveat: Suffocates psyllid nymphs and deters female oviposition. Safe for
      beneficial predators.
    source_id: uf_hlb
