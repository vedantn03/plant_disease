- crop: pepper,_bell
  condition: bacterial_spot
  pathogen_type: bacterial
  recommendation_text: Bell pepper bacterial spot (Xanthomonas campestris pv. vesicatoria)
    is managed through hot-water seed sanitation (50°C for 25 minutes), certified
    disease-free transplants, and avoiding overhead irrigation. Fixed copper bactericides
    combined with mancozeb provide protective suppression. Chemical fungicides are
    completely ineffective against this bacterial pathogen.
  caution_text: Do not apply synthetic fungicides as Xanthomonas is a bacterial pathogen.
    Copper-tolerant strains are documented; strictly observe local product labels
    and pre-harvest intervals.
  source_name: TNAU Agritech Portal — Horticultural Crop Protection
  source_url: https://agritech.tnau.ac.in/crop_protection/crop_prot_crop_diseases_veg_chillies.html
