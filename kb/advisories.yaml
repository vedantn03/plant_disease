    on upper and lower leaf surfaces, causing premature senescence. Unlike downy mildew,
    powdery mildew sporulates even in dry weather if humidity around canopy is moderate.
    Plant resistant hybrids and initiate fungicide sprays when the first colony appears
    on lower mature leaves.
  caution_text: Spray both upper and lower leaf surfaces thoroughly; mildew colonizes
    shaded lower lamina aggressively.
