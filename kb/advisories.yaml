advisories:
- crop: tomato
  condition: early_blight
  pathogen_type: fungal
  recommendation_text: 'Tomato early blight (Alternaria solani) is managed by removing
    infected lower leaves, improving air circulation, avoiding overhead irrigation,
    and applying registered fungicides when disease pressure is high. Copper-based
    fungicides and chlorothalonil are listed as options in the referenced source.
    Begin scouting at transplanting and treat when the first symptoms appear. Rotate
    fungicides to reduce resistance risk. Do not apply fungicides during heat stress.
    Consult the full extension guide for timing intervals and resistance management
    groups.

    '
  caution_text: 'Specific products and application rates must come from the product
    label and local registration. This text does not specify concentrations or application
    intervals. Resistance to fungicides has been reported; use Integrated Pest Management
    (IPM).

    '
  weather_rule:
    humidity_min: 75
    temp_min: 24
    temp_max: 32
    note: 'Current conditions (warm temperature, high humidity) are favourable for
      Alternaria sporulation and spread. Consider increasing scouting frequency. (Source:
      UC IPM, https://ipm.ucanr.edu/PMG/r783300111.html)

      '
    source: UC IPM
  source_name: UC IPM — University of California Statewide Integrated Pest Management
    Program
  source_url: https://ipm.ucanr.edu/PMG/r783300111.html
  last_verified: '2026-10-14'
  status: VERIFIED
  region: US (UC IPM) & India (ICAR-IIHR / TNAU)
  recommendation_scope: both
  cultural_controls:
  - practice: Remove lower infected foliage to reduce primary inoculum splash.
    source_id: uc_ipm_eb
  - practice: Employ drip irrigation or furrow irrigation; avoid sprinkler foliage
      wetting.
    source_id: tnau_eb
  - practice: 2 to 3-year crop rotation with non-solanaceous crops.
    source_id: uc_ipm_eb
  chemical_options:
  - active_ingredient: Chlorothalonil (FRAC M05) or Mancozeb (FRAC M03)
    rate_text: Apply according to registered local product label (e.g. 2.0-2.5 g/L
      water)
    label_caveat: Protective contact fungicide; apply prior to infection or at first
      sign of lower leaf lesion.
    source_id: uc_ipm_eb
  - active_ingredient: Difenoconazole 25% EC (FRAC 3)
    rate_text: 0.5 ml per liter of water as per CIBRC approved label recommendation
    label_caveat: Systemic triazole fungicide; rotate with multisite contact fungicides
      to prevent resistance.
    source_id: tnau_eb
  sources:
  - id: uc_ipm_eb
    publisher: University of California IPM
    url: https://ipm.ucanr.edu/PMG/r783300111.html
    access_date: '2026-10-14'
  - id: tnau_eb
    publisher: Tamil Nadu Agricultural University (TNAU) Agritech Portal
    url: https://agritech.tnau.ac.in/crop_protection/crop_prot_crop%20diseases_veg_tomato_1.html
    access_date: '2026-10-28'
  resistance_management_note: Rotate FRAC group 3 (Difenoconazole) with multisite
    protectants (FRAC M03/M05). Maximum 2 sequential applications of Group 3 fungicides.
  monitoring_or_thresholds_note: Scout weekly beginning at transplanting. Focus scouting
    on bottom 30 cm of canopy after rainfall.
- crop: tomato
  condition: late_blight
  pathogen_type: fungal
  recommendation_text: 'Tomato late blight (Phytophthora infestans) is a serious oomycete
    (water mould) disease. Management includes using certified disease-free seed/transplants,
    removing volunteer potato plants nearby (shared host), improving air circulation,
    and avoiding prolonged leaf wetness. Fungicides (oomyceticides) are recommended
    preventively before or at first sign of infection; curative activity is limited.
    The referenced source lists mancozeb, chlorothalonil, and copper-based materials
    as protective options; systemic products (e.g., metalaxyl-based) are listed for
    curative activity. Check local registrations and resistance status before use.

    '
  caution_text: 'P. infestans strains vary in fungicide sensitivity. Do not rely on
    a single mode of action. Rotate chemical groups according to FRAC codes. Specific
    rates and intervals must be taken from the product label. This advisory does not
    specify concentrations.

    '
  weather_rule:
    humidity_min: 90
    temp_min: 10
    temp_max: 25
    note: 'Cool, wet conditions (10-25°C, RH ≥ 90%) are highly favourable for late
      blight development and spread. Disease can progress very rapidly under these
      conditions; consider immediate scouting and preventive spray application if
      not already done. (Source: Cornell CALS, https://plantdisease.net/tomato_late_blight)

      '
    source: Cornell CALS
  source_name: Cornell Cooperative Extension — Vegetable Disease ID
  source_url: https://plantdisease.net/tomato_late_blight
  last_verified: '2026-10-14'
  status: VERIFIED
  region: US (Cornell CALS) & India (ICAR-IIHR / CPRI)
  recommendation_scope: both
  cultural_controls:
  - practice: Destroy all volunteer potato and tomato plants within 1 km (shared oomycete
      host).
    source_id: cornell_lb
  - practice: Select resistant cultivars (e.g. Mountain Magic, Defiant PHR, Kufri
      series).
    source_id: cornell_lb
  chemical_options:
  - active_ingredient: Mancozeb 75% WP or Chlorothalonil 75% WP
    rate_text: 2.0 - 2.5 g per liter of water
    label_caveat: Apply preventatively prior to cool, rainy weather. Limited curative
      activity.
    source_id: cornell_lb
  - active_ingredient: Cymoxanil 8% + Mancozeb 64% WP
    rate_text: 1.5 - 2.0 g per liter of water
    label_caveat: Kickback curative activity within 48 hours of infection; follow
      strict re-entry intervals.
    source_id: icar_lb
  sources:
  - id: cornell_lb
    publisher: Cornell Cooperative Extension CALS
    url: https://plantdisease.net/tomato_late_blight
    access_date: '2026-10-14'
  - id: icar_lb
    publisher: ICAR - Central Potato Research Institute (CPRI)
    url: https://cpri.icar.gov.in/
    access_date: '2026-10-28'
  resistance_management_note: Oomycete strains (A2 mating type) develop resistance
    rapidly. Alternate systemic translaminar chemistry with multisite contact protectants.
  monitoring_or_thresholds_note: Consult regional BLITECAST or weather alerts. Daily
    scouting required during cool, humid periods (RH > 90%, 12-22°C).
- crop: tomato
  condition: bacterial_spot
  pathogen_type: bacterial
  recommendation_text: 'Tomato bacterial spot (Xanthomonas vesicatoria and related
    species) is managed by using certified pathogen-free seed and transplants, crop
    rotation (at least two years away from solanaceous crops), avoiding overhead irrigation,
    and removing infected plant debris after harvest. Fixed copper bactericides are
    listed as a management option in the referenced source; effectiveness may be reduced
    where copper-resistant strains have developed. Mixing copper with mancozeb may
    improve efficacy according to the source. Fungicide applications are NOT effective
    against this bacterial pathogen.

    '
  caution_text: 'Copper resistance in Xanthomonas has been reported widely. This advisory
    does not specify application rates or intervals; consult the product label and
    a local extension specialist. No dosages are given here.

    '
  source_name: University of Florida IFAS Extension
  source_url: https://edis.ifas.ufl.edu/publication/VH014
  last_verified: '2026-10-14'
  status: VERIFIED
  region: Global (UF/IFAS & ICAR-IIHR)
  recommendation_scope: both
  cultural_controls:
  - practice: Use certified pathogen-free seed and disease-free transplants.
    source_id: primary_source
  - practice: Minimum 2-year rotation away from solanaceous crops (tomato, pepper,
      eggplant).
    source_id: primary_source
  chemical_options:
  - active_ingredient: Copper Hydroxide (FRAC M01) + Mancozeb (FRAC M03) tank mix
    rate_text: Apply at label rates preventatively during humid weather. Standard
      fungicides alone are ineffective against bacteria.
    label_caveat: Fixed copper protectant bactericide; mancozeb enhances copper ion
      activity against copper-tolerant Xanthomonas.
    source_id: primary_source
  sources:
  - id: primary_source
    publisher: University of Florida IFAS Extension
    url: https://edis.ifas.ufl.edu/publication/VH014
    access_date: '2026-10-14'
- crop: potato
  condition: early_blight
  pathogen_type: fungal
  recommendation_text: 'Potato early blight (Alternaria solani) is managed by maintaining
    plant vigour through balanced fertilisation (low-nitrogen stress increases susceptibility),
    using certified seed potatoes, rotating crops (two to three year rotation), and
    applying fungicides at first symptom appearance or based on regional forecasting
    models. The referenced source lists chlorothalonil, mancozeb, and copper-based
    products as options. Start applications when lower leaves show first lesions and
    conditions favour disease spread.

    '
  caution_text: 'Specific rates and timing intervals must be obtained from the product
    label and local extension recommendations. This text does not provide concentrations.

    '
  weather_rule:
    humidity_min: 70
    temp_min: 24
    temp_max: 29
    note: 'Warm temperatures (24-29°C) with moderate humidity favour Alternaria sporulation.
      Scout lower canopy leaves; early intervention is more effective. (Source: UMaine
      Extension, https://extension.umaine.edu/publications/2436e/)

      '
    source: UMaine Extension
  source_name: University of Maine Cooperative Extension
  source_url: https://extension.umaine.edu/publications/2436e/
  last_verified: '2026-10-14'
  status: VERIFIED
  region: US (UMaine Extension) & India (ICAR-CPRI)
  recommendation_scope: both
  cultural_controls:
  - practice: Maintain optimal nitrogen fertilization; early blight severity increases
      under nutrient deficiency.
    source_id: umaine_pe
  - practice: Harvest tubers only after vine maturity to prevent skinning and spore
      transmission.
    source_id: cpri_pe
  chemical_options:
  - active_ingredient: Mancozeb 75% WP
    rate_text: 2.0 - 2.5 kg/ha in 500 L water (or 2.5 g/L)
    label_caveat: Multisite surface protectant. Apply at first sign of concentric
      ring lesions on lower leaves.
    source_id: cpri_pe
  sources:
  - id: umaine_pe
    publisher: University of Maine Cooperative Extension
    url: https://extension.umaine.edu/publications/2436e/
    access_date: '2026-10-14'
  - id: cpri_pe
    publisher: ICAR - Central Potato Research Institute
    url: https://cpri.icar.gov.in/
    access_date: '2026-10-28'
  resistance_management_note: Alternaria solani exhibits resistance to QoI (FRAC 11)
    strobilurins in multiple production regions. Rely primarily on multisite protectants.
  monitoring_or_thresholds_note: Begin surveillance post-tuber initiation (45-50 days
    after planting).
- crop: potato
  condition: late_blight
  pathogen_type: fungal
  recommendation_text: 'Potato late blight (Phytophthora infestans) is one of the
    most destructive plant diseases. Management relies on: certified disease-free
    seed potatoes, resistant varieties where available, destroying volunteer potato
    plants, prompt removal of infected foliage (haulm destruction), and a preventive
    fungicide program. The referenced source lists protective fungicides (e.g., mancozeb,
    chlorothalonil) and systemic oomyceticides; start applications before disease
    appears and continue on a schedule based on weather conditions and regional forecasts.

    '
  caution_text: 'Do not rely on a single chemical mode of action — resistance to metalaxyl
    is widespread in some regions. Rotate FRAC groups. Specific rates and intervals
    are on the product label. This advisory does not provide concentrations.

    '
  weather_rule:
    humidity_min: 90
    temp_min: 10
    temp_max: 24
    note: 'Cool, wet conditions are ideal for P. infestans. These conditions may justify
      shortening spray intervals and increasing scouting frequency. (Source: UMaine
      Extension, https://extension.umaine.edu/publications/2436e/)

      '
    source: UMaine Extension
  source_name: University of Maine Cooperative Extension
  source_url: https://extension.umaine.edu/publications/2436e/
  last_verified: '2026-10-14'
  status: VERIFIED
  region: US (UMass Extension) & India (ICAR-CPRI)
  recommendation_scope: both
  cultural_controls:
  - practice: Plant certified disease-free seed tubers with zero late blight tolerance.
    source_id: umass_plb
  - practice: High hilling / earthing-up to build 10-15 cm soil barrier over developing
      tubers.
    source_id: cpri_plb
  chemical_options:
  - active_ingredient: Mancozeb 75% WP
    rate_text: 2.5 g per liter of water as prophylactic spray
    label_caveat: Multisite contact protectant; ensure complete adaxial and abaxial
      foliar coverage.
    source_id: cpri_plb
  - active_ingredient: Dimethomorph 50% WP
    rate_text: 1.0 g per liter of water (CIBRC approved rate)
    label_caveat: Translaminar oomyceticide; apply only in mixture with protective
      mancozeb.
    source_id: cpri_plb
  sources:
  - id: umass_plb
    publisher: University of Massachusetts Amherst Extension
    url: https://ag.umass.edu/vegetable/fact-sheets/potato-late-blight
    access_date: '2026-10-14'
  - id: cpri_plb
    publisher: ICAR - Central Potato Research Institute
    url: https://cpri.icar.gov.in/
    access_date: '2026-10-28'
  resistance_management_note: Metalaxyl resistance is widespread in Indian hills and
    plains; use mixed-mode translaminar partnerships.
  monitoring_or_thresholds_note: Monitor regional Indo-Blightcast meteorological forecasting
    advisories.
