stages:
  audit_and_split:
    cmd: python scripts/audit_and_split.py
    deps:
      - scripts/audit_and_split.py
      - configs/config.yaml
    params:
      - configs/config.yaml:
          - seed
          - split.train
          - split.val
          - split.test
          - data.subsample_per_class
    outs:
      - data/splits/train.csv
      - data/splits/val.csv
      - data/splits/test.csv
      - reports/audit_report.md

  train:
    cmd: python scripts/train.py
    deps:
      - scripts/train.py
      - src/model.py
      - src/dataset.py
      - configs/config.yaml
      - data/splits/train.csv
      - data/splits/val.csv
      - data/splits/manifest_hashes.json
    params:
      - configs/config.yaml:
          - seed
          - model.arch
          - model.pretrained
          - model.num_classes
          - model.imbalance_strategy
          - training.epochs
          - training.batch_size
          - training.lr
          - training.weight_decay
          - training.amp
    outs:
      - models/best_model.pth

  evaluate:
    cmd: python scripts/evaluate.py
    deps:
      - scripts/evaluate.py
      - src/model.py
      - src/dataset.py
      - models/best_model.pth
      - data/splits/test.csv
      - configs/config.yaml
    params:
      - configs/config.yaml:
          - seed
          - data.image_size
    outs:
      - reports/metrics.json
      - reports/eval_summary.json
      - reports/per_class_metrics.csv
      - reports/per_crop_metrics.json
      - reports/EVALUATION_REPORT.md

  segment_benchmark:
    cmd: python scripts/benchmark_segmentation.py
    deps:
      - scripts/benchmark_segmentation.py
      - src/segmentation.py
      - data/splits/test.csv
    outs:
      - reports/segmentation_quality.json

  bias_study:
    cmd: python scripts/run_bias_experiments.py
    deps:
      - scripts/run_bias_experiments.py
      - src/segmentation.py
      - src/model.py
      - data/splits/train.csv
      - data/splits/test.csv
      - configs/config.yaml
    params:
      - configs/config.yaml:
          - seed
    outs:
      - reports/bias_study_metrics.json
      - reports/BIAS_STUDY.md

  robustness_eval:
    cmd: python scripts/robustness_eval.py
    deps:
      - scripts/robustness_eval.py
      - src/robustness.py
      - reports/metrics.json
      - reports/bias_study_metrics.json
      - reports/explain_metrics.json
      - reports/segmentation_quality.json
    outs:
      - reports/robustness_metrics.json
      - reports/robustness_report.md

  ood_evaluate:
    cmd: python scripts/evaluate_ood.py
    deps:
      - scripts/evaluate_ood.py
      - src/ood_detector.py
      - models/best_model.pth
      - data/splits/test.csv
      - configs/config.yaml
    params:
      - configs/config.yaml:
          - seed
    outs:
      - reports/ood_metrics.json
      - reports/ood_report.md

  hierarchy_evaluate:
    cmd: python scripts/evaluate_hierarchy.py
    deps:
      - scripts/evaluate_hierarchy.py
      - kb/coverage.yaml
      - models/best_model.pth
      - data/splits/test.csv
      - configs/config.yaml
    outs:
      - reports/hierarchy_metrics.json
      - reports/hierarchy_report.md

  explainability:
    cmd: python scripts/run_explainability.py
    deps:
      - scripts/run_explainability.py
      - src/model.py
      - src/segmentation.py
      - models/best_model.pth
      - data/splits/test.csv
      - configs/config.yaml
    params:
      - configs/config.yaml:
          - seed
    outs:
      - reports/explain_metrics.json
      - reports/EXPLAINABILITY.md

  promote:
    cmd: python scripts/promote.py --dry-run --candidate-is-champion-baseline --candidate-metrics reports/gate_baselines_val.json
    deps:
      - scripts/promote.py
      - src/gates.py
      - src/registry.py
      - configs/config.yaml
      - configs/gates/gate_thresholds.yaml
      - reports/gate_baselines_val.json
    params:
      - configs/config.yaml:
          - evaluation.promotion_margin
          - evaluation.gate_thresholds_path
          - mlflow.registered_model_name
          - mlflow.champion_alias
    outs:
      - reports/promotion_log.jsonl

  reproduce_check:
    cmd: python scripts/reproduce_check.py
    deps:
      - scripts/reproduce_check.py
      - models/best_model.pth
      - data/splits/test.csv
      - configs/config.yaml
    params:
      - configs/config.yaml:
          - seed
    outs:
      - reports/reproduce_check.json
